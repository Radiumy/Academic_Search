# URL 黑名单 - 用于排除特定 URL 模式（正则表达式）
blacklist_regex:
  # 文件扩展名
  - "\\.(jpg|jpeg|png|gif|pdf|zip|ico|svg|webp|mp4|mp3|avi|mov|wmv|flv|webm|doc|docx|xls|xlsx|ppt|pptx|txt|csv|json|xml|js|css)$"

  # 查询参数
  - "[?&]utm_"
  - "[?&]source="
  - "[?&]ref="
  - "[?&]medium="
  - "[?&]campaign="
  - "[?&]term="
  - "[?&]content="
  - "[?&]page="
  - "[?&]sort="
  - "[?&]filter="

